<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판매현황 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fc; color: #1c1c2e; }

  header { background:#fff; border-bottom:1px solid #eee; padding:0 40px; height:64px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-dot { width:10px; height:10px; border-radius:50%; background:#6C63FF; }
  .logo-text { font-size:16px; font-weight:700; letter-spacing:-0.3px; }
  .header-right { font-size:12px; color:#999; }

  .connect-bar { background:#fff; border-bottom:1px solid #eee; padding:12px 40px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .connect-bar label { font-size:12px; color:#888; white-space:nowrap; }
  .connect-bar input { padding:7px 12px; font-size:13px; font-family:inherit; border:1.5px solid #e8e8f0; border-radius:10px; background:#fafafa; color:#1c1c2e; transition:border-color 0.2s; }
  .connect-bar input:focus { outline:none; border-color:#6C63FF; background:#fff; }
  .connect-bar input.wide { width:300px; }
  .btn-load { padding:7px 18px; background:#6C63FF; color:#fff; border:none; border-radius:10px; font-size:13px; font-weight:500; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .btn-load:hover { background:#574fd6; }
  #statusMsg { font-size:12px; }

  .sheet-tabs { background:#fff; border-bottom:2px solid #eee; padding:0 40px; display:flex; overflow-x:auto; }
  .sheet-tab { padding:14px 20px; font-size:14px; font-weight:500; color:#aaa; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all 0.2s; font-family:inherit; background:none; border-top:none; border-left:none; border-right:none; white-space:nowrap; }
  .sheet-tab:hover { color:#6C63FF; }
  .sheet-tab.active { color:#6C63FF; border-bottom-color:#6C63FF; }
  .tab-badge { display:inline-block; margin-left:6px; font-size:11px; background:#f0eeff; color:#6C63FF; padding:1px 7px; border-radius:20px; font-weight:500; }

  main { max-width:1280px; margin:0 auto; padding:32px 40px; }

  .page-title-wrap { text-align:center; margin-bottom:28px; }
  .page-title { font-size:22px; font-weight:700; letter-spacing:-0.5px; }
  .page-subtitle { font-size:13px; color:#999; margin-top:4px; }

  .period-bar { display:flex; justify-content:center; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .period-btn { padding:9px 22px; border-radius:50px; font-size:14px; font-weight:500; font-family:inherit; cursor:pointer; border:1.5px solid #e0e0ee; background:#fff; color:#888; transition:all 0.2s; }
  .period-btn:hover { border-color:#6C63FF; color:#6C63FF; }
  .period-btn.active { background:#6C63FF; color:#fff; border-color:#6C63FF; }
  .month-select-wrap { display:none; justify-content:center; margin-bottom:20px; }
  .month-select-wrap.show { display:flex; }
  .month-select-wrap select { padding:8px 16px; border:1.5px solid #e0e0ee; border-radius:10px; font-size:14px; font-family:inherit; color:#333; background:#fff; cursor:pointer; }

  .metric-grid { display:grid; gap:16px; margin-bottom:24px; }
  .g3 { grid-template-columns:repeat(3,1fr); }
  .g4 { grid-template-columns:repeat(4,1fr); }
  .metric-card { background:#fff; border-radius:16px; padding:20px 22px; border:1px solid #f0f0f8; position:relative; overflow:hidden; }
  .metric-card::after { content:''; position:absolute; top:0; left:0; width:4px; height:100%; border-radius:16px 0 0 16px; }
  .mc1::after{background:#6C63FF;} .mc2::after{background:#22c997;} .mc3::after{background:#FF6B6B;} .mc4::after{background:#FFA94D;} .mc5::after{background:#4dabf7;} .mc6::after{background:#f06595;}
  .metric-label { font-size:12px; color:#999; margin-bottom:8px; }
  .metric-value { font-size:28px; font-weight:700; letter-spacing:-1px; }
  .metric-sub { font-size:11px; color:#bbb; margin-top:5px; }

  .section-title { font-size:15px; font-weight:700; color:#1c1c2e; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .section-title::before { content:''; display:inline-block; width:4px; height:18px; background:#6C63FF; border-radius:2px; }

  .chart-row { display:grid; gap:20px; margin-bottom:20px; }
  .chart-row.two { grid-template-columns:1fr 1fr; }
  .chart-row.three { grid-template-columns:1fr 1fr 1fr; }
  .card { background:#fff; border-radius:16px; padding:24px; border:1px solid #f0f0f8; }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .card-title { font-size:14px; font-weight:600; }
  .card-badge { font-size:11px; color:#6C63FF; background:#f0eeff; padding:3px 10px; border-radius:20px; }

  /* 인라인 수치 블록 */
  .stat-row { display:flex; gap:40px; padding:8px 0; flex-wrap:wrap; }
  .stat-item { min-width:120px; }
  .stat-label { font-size:12px; color:#999; margin-bottom:6px; }
  .stat-hint { font-size:11px; margin-left:4px; }
  .stat-val { font-size:30px; font-weight:700; letter-spacing:-1px; cursor:default; }
  .stat-unit { font-size:13px; font-weight:500; color:#aaa; margin-left:3px; }

  /* DONUT */
  .donut-wrap { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .donut-canvas-wrap { position:relative; width:170px; height:170px; flex-shrink:0; }
  .donut-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
  .donut-center-val { font-size:20px; font-weight:700; color:#1c1c2e; line-height:1; }
  .donut-center-label { font-size:11px; color:#999; margin-top:3px; }
  .donut-legend { flex:1; min-width:120px; }
  .legend-item { display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:13px; }
  .legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend-name { color:#333; flex:1; }
  .legend-val { color:#999; font-size:12px; white-space:nowrap; }

  /* BAR */
  .bar-item { margin-bottom:12px; }
  .bar-item:last-child { margin-bottom:0; }
  .bar-meta { display:flex; justify-content:space-between; margin-bottom:5px; }
  .bar-name { font-size:13px; color:#333; }
  .bar-count { font-size:12px; color:#999; }
  .bar-track { background:#f3f3f8; border-radius:6px; height:7px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:6px; transition:width 0.8s cubic-bezier(0.4,0,0.2,1); }

  .chart-wrap { position:relative; height:240px; }

  /* TOOLTIP */
  .tooltip-wrap { position:relative; cursor:default; }
  .custom-tooltip { position:fixed; background:#1c1c2e; color:#fff; font-size:13px; line-height:1.9; padding:10px 16px; border-radius:10px; pointer-events:none; white-space:pre; z-index:9999; box-shadow:0 4px 20px rgba(0,0,0,0.2); }

  .empty { color:#ccc; font-size:13px; text-align:center; padding:40px; }
  .sheet-panel { display:none; }
  .sheet-panel.active { display:block; }

  .divider { height:1px; background:#f0f0f8; margin:24px 0; }

  @media (max-width:900px) {
    main { padding:20px 16px; }
    header, .connect-bar, .sheet-tabs { padding-left:16px; padding-right:16px; }
    .metric-grid.g3, .metric-grid.g4 { grid-template-columns:repeat(2,1fr); }
    .chart-row.two, .chart-row.three { grid-template-columns:1fr; }
    .connect-bar input.wide { width:180px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div><span class="logo-text">판매현황 대시보드</span></div>
  <span class="header-right" id="lastUpdate">데이터를 불러와 주세요</span>
</header>

<div class="connect-bar">
  <label>시트 ID</label>
  <input class="wide" id="sheetId" value="14j3hDW3Hn-1ftkJlqZhEZhWTt38eZU8S4yMoadenrR4" />
  <button class="btn-load" onclick="loadAll()">불러오기</button>
  <span id="statusMsg"></span>
</div>

<div class="sheet-tabs" id="sheetTabs" style="display:none;">
  <button class="sheet-tab active" onclick="switchTab(0)" id="tab0">상품별 현황</button>
  <button class="sheet-tab" onclick="switchTab(1)" id="tab1">차량별 현황</button>
  <button class="sheet-tab" onclick="switchTab(2)" id="tab2">판매채널별 현황</button>
  <button class="sheet-tab" onclick="switchTab(3)" id="tab3">수행자별 현황</button>
</div>

<main>
  <div id="panel0" class="sheet-panel active">
    <div class="page-title-wrap">
      <div class="page-title">판매지원팀 판매현황</div>
      <div class="page-subtitle" id="p0_subtitle">데이터를 불러오면 현황이 표시됩니다</div>
    </div>
    <div class="period-bar">
      <button class="period-btn active" onclick="setPeriod('month')" id="btn_month">금월 현황</button>
      <button class="period-btn" onclick="setPeriod('total')" id="btn_total">누적 현황</button>
      <button class="period-btn" onclick="setPeriod('pick')" id="btn_pick">월별 선택</button>
    </div>
    <div class="month-select-wrap" id="monthSelectWrap">
      <select id="monthPicker" onchange="renderAll()"><option value="">월을 선택해주세요</option></select>
    </div>
    <div id="p0_content"></div>
  </div>

  <div id="panel1" class="sheet-panel">
    <div class="page-title-wrap">
      <div class="page-title">차량별 현황</div>
      <div class="page-subtitle" id="p1_subtitle"></div>
    </div>
    <div id="p1_content"></div>
  </div>

  <div id="panel2" class="sheet-panel">
    <div class="page-title-wrap">
      <div class="page-title">판매채널별 현황</div>
      <div class="page-subtitle" id="p2_subtitle"></div>
    </div>
    <div id="p2_content"></div>
  </div>

  <div id="panel3" class="sheet-panel">
    <div class="page-title-wrap">
      <div class="page-title">수행자별 현황</div>
      <div class="page-subtitle" id="p3_subtitle"></div>
    </div>
    <div id="p3_content"></div>
  </div>
</main>

<script>
const COLORS = ['#6C63FF','#22c997','#FF6B6B','#FFA94D','#4dabf7','#f06595','#a9e34b','#74c0fc','#e599f7','#ffd43b'];
let rawTable = null;
let currentPeriod = 'month';
const charts = {};

// 수행원 이름 매핑
const WORKER_MAP = {
  '이연수':'하모니','이현수':'하모니','백광현':'하모니',
  '양서영':'토스','염대현':'토스','박주영':'토스',
  '주식회사 하렌파트너스':'하렌파트너스'
};
function mapWorker(v) {
  const s = (v||'').toString().trim();
  for (const [k,label] of Object.entries(WORKER_MAP)) {
    if (s.includes(k)) return label;
  }
  return s.slice(0,3) || '미확인';
}

function setStatus(msg, ok) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.color = ok===false?'#FF6B6B':ok===true?'#22c997':'#999';
}

function switchTab(idx) {
  [0,1,2,3].forEach(i => {
    document.getElementById(`tab${i}`).classList.toggle('active', i===idx);
    document.getElementById(`panel${i}`).classList.toggle('active', i===idx);
  });
}

function setPeriod(p) {
  currentPeriod = p;
  ['month','total','pick'].forEach(k => document.getElementById(`btn_${k}`).classList.toggle('active', k===p));
  document.getElementById('monthSelectWrap').classList.toggle('show', p==='pick');
  renderP0();
}

async function loadAll() {
  const id = document.getElementById('sheetId').value.trim();
  if (!id) { setStatus('시트 ID를 입력해주세요.', false); return; }
  setStatus('불러오는 중...', null);
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent('판매현황테스트')}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) throw new Error('파싱 실패');
    const json = JSON.parse(match[1]);
    if (!json.table?.rows?.length) throw new Error('데이터 없음');
    rawTable = json.table;
    const now = new Date();
    document.getElementById('lastUpdate').textContent = `${now.toLocaleDateString('ko-KR')} ${now.toLocaleTimeString('ko-KR')} 기준`;
    document.getElementById('sheetTabs').style.display = 'flex';
    setBadge('tab0', rawTable.rows.length);
    setBadge('tab1', rawTable.rows.length);
    setBadge('tab2', rawTable.rows.length);
    setBadge('tab3', rawTable.rows.length);
    populateMonthPicker();
    renderAll();
    setStatus(`✓ ${rawTable.rows.length.toLocaleString()}건`, true);
  } catch(e) {
    setStatus('❌ ' + e.message, false);
  }
}

function setBadge(tabId, count) {
  const old = document.getElementById(tabId).querySelector('.tab-badge');
  if (old) old.remove();
  const b = document.createElement('span'); b.className='tab-badge'; b.textContent=count.toLocaleString()+'건';
  document.getElementById(tabId).appendChild(b);
}

function getRows() {
  const cols = rawTable.cols.map(c => c.label);
  const rows = rawTable.rows.map(r => r.c.map(c => c ? c.v : null));
  const idx = n => cols.findIndex(c => c && c.includes(n));
  return { cols, rows, idx };
}

function getYearMonth(v) {
  if (!v) return null;
  const d = v.toString().match(/Date\((\d{4}),(\d+),(\d+)\)/);
  if (d) return `${d[1]}.${String(parseInt(d[2])+1).padStart(2,'0')}`;
  const m = v.toString().match(/(\d{4})[.\-\/](\d{1,2})/);
  return m ? `${m[1]}.${m[2].padStart(2,'0')}` : null;
}

function populateMonthPicker() {
  const { rows, idx } = getRows();
  const iDate = idx('계약실행일');
  const months = new Set();
  if (iDate >= 0) rows.forEach(r => { const m = getYearMonth(r[iDate]); if(m) months.add(m); });
  const sorted = [...months].sort().reverse();
  const sel = document.getElementById('monthPicker');
  sel.innerHTML = '<option value="">월을 선택해주세요</option>' + sorted.map(m=>`<option value="${m}">${m}</option>`).join('');
}

function filterRows(rows, iDate) {
  if (currentPeriod === 'total') return rows;
  const now = new Date();
  const thisMonth = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}`;
  if (currentPeriod === 'month') return rows.filter(r => getYearMonth(r[iDate]) === thisMonth);
  const picked = document.getElementById('monthPicker').value;
  return picked ? rows.filter(r => getYearMonth(r[iDate]) === picked) : [];
}

function getPeriodLabel() {
  const now = new Date();
  if (currentPeriod === 'month') return `${now.getFullYear()}년 ${now.getMonth()+1}월`;
  if (currentPeriod === 'total') return '전체 누적';
  const picked = document.getElementById('monthPicker').value;
  return picked ? picked.replace('.','년 ')+'월' : '월 선택';
}

function countMap(arr, keyFn) {
  const m = {};
  arr.forEach(r => { const v = keyFn(r)||'미분류'; m[v]=(m[v]||0)+1; });
  return m;
}

function avgVal(arr, iRental) {
  const vals = arr.map(r => parseFloat((r[iRental]||'').toString().replace(/[^0-9.-]/g,''))).filter(v=>!isNaN(v)&&v>0);
  if (!vals.length) return '-';
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length).toLocaleString()+'원';
}

function renderAll() {
  if (!rawTable) return;
  renderP0();
  renderP1();
  renderP2();
  renderP3();
}

// ===================== P0: 상품별 현황 =====================
function renderP0() {
  if (!rawTable) return;
  const { rows, idx } = getRows();
  const iDate   = idx('계약실행일');
  const iProd   = idx('상품구분');
  const iType   = idx('상품유형');
  const iNoDepo = idx('무보증여부');
  const iEnd    = idx('종료후처리');
  const iWorker = idx('수행원');
  const iAge    = idx('계약 당시 연령대');
  const iRental = idx('렌탈료');

  const filtered = filterRows(rows, iDate);
  document.getElementById('p0_subtitle').textContent = `${getPeriodLabel()} 기준 · ${filtered.length.toLocaleString()}건`;

  const shincha = filtered.filter(r => (r[iProd]||'').includes('신차'));
  const rerent  = filtered.filter(r => { const v=(r[iProd]||''); return v.includes('재렌트')||v.includes('재'); });

  const shinchaTypeMap = iType>=0 ? countMap(shincha, r=>(r[iType]||'').toString().trim()) : {};
  const rerentTypeMap  = iType>=0 ? countMap(rerent,  r=>(r[iType]||'').toString().trim()) : {};

  // 무보증
  const isNoDepo = v => (v||'').toString().trim()==='Y';
  const shinND   = shincha.filter(r=>isNoDepo(r[iNoDepo]));
  const rerentND = rerent.filter(r=>isNoDepo(r[iNoDepo]));

  // 무보증 연령대 툴팁
  const ageTip = arr => {
    if (!arr.length||iAge<0) return '';
    const m = countMap(arr, r=>(r[iAge]||'미확인').toString().trim());
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`${k}  ${v}건`).join('\n');
  };

  // 만기처리
  const isSelect = v => { const s=(v||'').toString().trim(); return ['반납','반납/연장/인수','양도/반납'].includes(s); };
  const isInsu   = v => (v||'').toString().trim()==='양도(인수)';
  const insuRows    = filtered.filter(r=>isInsu(r[iEnd]));
  const selectCount = filtered.filter(r=>isSelect(r[iEnd])).length;

  // 인수형 수행자 툴팁
  const workerTip = arr => {
    if (!arr.length||iWorker<0) return '';
    const m = countMap(arr, r=>mapWorker(r[iWorker]));
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}  ${v}건`).join('\n');
  };

  // 동반차/구독카 중 인수형
  const dongbanInsu = insuRows.filter(r=>(r[iType]||'').includes('동반차')).length;
  const gudokInsu   = insuRows.filter(r=>(r[iType]||'').includes('구독')).length;

  // 평균 렌탈료
  const shinAvg   = avgVal(shincha, iRental);
  const rerentAvg = avgVal(rerent, iRental);

  const html = `
    <div class="metric-grid g3">
      <div class="metric-card mc1"><div class="metric-label">전체 계약</div><div class="metric-value">${filtered.length.toLocaleString()}</div><div class="metric-sub">건</div></div>
      <div class="metric-card mc2"><div class="metric-label">신차</div><div class="metric-value">${shincha.length.toLocaleString()}</div><div class="metric-sub">건</div></div>
      <div class="metric-card mc3"><div class="metric-label">재렌트</div><div class="metric-value">${rerent.length.toLocaleString()}</div><div class="metric-sub">건</div></div>
    </div>

    <div class="section-title">상품유형별 현황</div>
    <div class="chart-row two" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-header"><span class="card-title">신차 상품유형</span><span class="card-badge">${shincha.length}건</span></div>
        <div class="donut-wrap">
          <div class="donut-canvas-wrap"><canvas id="donut_shincha"></canvas><div class="donut-center"><div class="donut-center-val">${shincha.length}</div><div class="donut-center-label">신차</div></div></div>
          <div class="donut-legend" id="legend_shincha"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">재렌트 상품유형</span><span class="card-badge">${rerent.length}건</span></div>
        <div class="donut-wrap">
          <div class="donut-canvas-wrap"><canvas id="donut_rerent"></canvas><div class="donut-center"><div class="donut-center-val">${rerent.length}</div><div class="donut-center-label">재렌트</div></div></div>
          <div class="donut-legend" id="legend_rerent"></div>
        </div>
      </div>
    </div>

    <div class="chart-row two" style="margin-bottom:20px;">
      <div class="card">
        <div class="section-title" style="margin-bottom:12px;">무보증 현황</div>
        <div class="stat-row">

// ===================== P2: 판매채널별 현황 =====================
function renderP2() {

  const iProd    = idx('상품구분');

  const iSeries  = idx('시리즈명');

  const filtered = filterRows(rows, iDate);
  document.getElementById('p2_subtitle').textContent = `${getPeriodLabel()} 기준 · ${filtered.length.toLocaleString()}건`;

  const shincha = filtered.filter(r=>(r[iProd]||'').includes('신차'));
  const rerent  = filtered.filter(r=>{const v=(r[iProd]||'');return v.includes('재렌트')||v.includes('재');});

  const chAll  = iChannel>=0 ? countMap(filtered, r=>(r[iChannel]||'미분류').toString().trim()) : {};
  const chShin = iChannel>=0 ? countMap(shincha,  r=>(r[iChannel]||'미분류').toString().trim()) : {};
  const chRe   = iChannel>=0 ? countMap(rerent,   r=>(r[iChannel]||'미분류').toString().trim()) : {};

  // 채널별 렌탈료 평균
  const chAvgMap = {};
  if (iChannel>=0 && iRental>=0) {
    const m = {};
    filtered.forEach(r => {
      const ch=(r[iChannel]||'미분류').toString().trim();
      const v=parseFloat((r[iRental]||'').toString().replace(/[^0-9.-]/g,''));
      if(!isNaN(v)&&v>0){if(!m[ch])m[ch]=[];m[ch].push(v);}

  document.getElementById('p2_content').innerHTML = `

      <div class="metric-card mc1"><div class="metric-label">전체 계약</div><div class="metric-value">${filtered.length.toLocaleString()}</div><div class="metric-sub">건</div></div>
      <div class="metric-card mc2"><div class="metric-label">채널 수</div><div class="metric-value">${Object.keys(chAll).length}</div><div class="metric-sub">개</div></div>
      <div class="metric-card mc3"><div class="metric-label">TOP 채널</div><div class="metric-value" style="font-size:18px;">${topChName}</div><div class="metric-sub">${topChCount}건</div></div>
      <div class="metric-card mc4"><div class="metric-label">평균 렌탈료</div><div class="metric-value" style="font-size:18px;">${avgVal(filtered,iRental)}</div><div class="metric-sub">전체</div></div>
    </div>

    <div class="chart-row two" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-header"><span class="card-title">채널별 전체 현황</span><span class="card-badge">${Object.keys(chAll).length}개 채널</span></div>
        <div class="donut-wrap">
          <div class="donut-canvas-wrap"><canvas id="donut_ch_all"></canvas><div class="donut-center"><div class="donut-center-val">${filtered.length}</div><div class="donut-center-label">전체</div></div></div>
          <div class="donut-legend" id="legend_ch_all"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">채널별 평균 렌탈료</span></div>
        <div id="ch_avg_bar"></div>
      </div>
    </div>

    <div class="chart-row two" style="margin-bottom:40px;">
      <div class="card"><div class="card-header"><span class="card-title">신차 채널별</span><span class="card-badge">${shincha.length}건</span></div><div id="ch_shin_bar"></div></div>
      <div class="card"><div class="card-header"><span class="card-title">재렌트 채널별</span><span class="card-badge">${rerent.length}건</span></div><div id="ch_re_bar"></div></div>
    </div>
  `;

}

// ===================== P3: 수행자별 현황 =====================
function renderP3() {
  if (!rawTable) return;
  const { rows, idx } = getRows();
  const iDate   = idx('계약실행일');
  const iProd   = idx('상품구분');
  const iWorker = idx('수행원');
  const iType   = idx('상품유형');
  const iRental = idx('렌탈료');
  const iEnd    = idx('종료후처리');

  const filtered = filterRows(rows, iDate);
  document.getElementById('p3_subtitle').textContent = `${getPeriodLabel()} 기준 · ${filtered.length.toLocaleString()}건`;

  const isInsu = v => (v||'').toString().trim()==='양도(인수)';

  // 수행자별 집계
  const workerStats = {};
  filtered.forEach(r => {
    const name = mapWorker(r[iWorker]);
    if (!workerStats[name]) workerStats[name] = { total:0, shin:0, re:0, insu:0, rentals:[] };
    const s = workerStats[name];
    s.total++;
    if ((r[iProd]||'').includes('신차')) s.shin++;
    if ((r[iProd]||''). includes('재렌트')||(r[iProd]||'').includes('재')) s.re++;
    if (iEnd>=0 && isInsu(r[iEnd])) s.insu++;
    const rv = parseFloat((r[iRental]||'').toString().replace(/[^0-9.-]/g,''));
    if (!isNaN(rv)&&rv>0) s.rentals.push(rv);
  });

  const sorted = Object.entries(workerStats).sort((a,b)=>b[1].total-a[1].total);
  const totalAll = filtered.length;

  const workerCountMap = {};
  sorted.forEach(([k,v]) => workerCountMap[k]=v.total);

  document.getElementById('p3_content').innerHTML = `
    <div class="metric-grid g4" style="margin-bottom:24px;">
      <div class="metric-card mc1"><div class="metric-label">전체 계약</div><div class="metric-value">${filtered.length.toLocaleString()}</div><div class="metric-sub">건</div></div>
      <div class="metric-card mc2"><div class="metric-label">수행자 수</div><div class="metric-value">${sorted.length}</div><div class="metric-sub">명</div></div>
      <div class="metric-card mc3"><div class="metric-label">TOP 수행자</div><div class="metric-value" style="font-size:18px;">${sorted[0]?.[0]||'-'}</div><div class="metric-sub">${sorted[0]?.[1]?.total||0}건</div></div>
      <div class="metric-card mc4"><div class="metric-label">인수형 합계</div><div class="metric-value">${sorted.reduce((a,[,v])=>a+v.insu,0)}</div><div class="metric-sub">건</div></div>
    </div>

    <div class="chart-row two" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-header"><span class="card-title">수행자별 계약 건수</span></div>
        <div id="worker_bar"></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">수행자별 비중</span></div>
        <div class="donut-wrap">
          <div class="donut-canvas-wrap"><canvas id="donut_worker"></canvas><div class="donut-center"><div class="donut-center-val">${filtered.length}</div><div class="donut-center-label">전체</div></div></div>
          <div class="donut-legend" id="legend_worker"></div>
        </div>
      </div>
    </div>

    <div class="section-title">수행자별 상세 현황</div>
    <div class="card" style="margin-bottom:40px; overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="border-bottom:2px solid #f0f0f8;">
            <th style="text-align:left;padding:10px 12px;color:#999;font-weight:500;">수행자</th>
            <th style="text-align:right;padding:10px 12px;color:#999;font-weight:500;">전체</th>
            <th style="text-align:right;padding:10px 12px;color:#999;font-weight:500;">신차</th>
            <th style="text-align:right;padding:10px 12px;color:#999;font-weight:500;">재렌트</th>
            <th style="text-align:right;padding:10px 12px;color:#999;font-weight:500;">인수형</th>
            <th style="text-align:right;padding:10px 12px;color:#999;font-weight:500;">평균렌탈료</th>
            <th style="text-align:right;padding:10px 12px;color:#999;font-weight:500;">비중</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map(([name,s],i) => {
            const avg = s.rentals.length ? Math.round(s.rentals.reduce((a,b)=>a+b,0)/s.rentals.length).toLocaleString()+'원' : '-';
            const pct = Math.round(s.total/totalAll*100);
            const color = COLORS[i%COLORS.length];
            return `<tr style="border-bottom:1px solid #f8f8fc;">
              <td style="padding:10px 12px;font-weight:600;">
                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:8px;"></span>${name}
              </td>
              <td style="text-align:right;padding:10px 12px;font-weight:700;">${s.total}</td>
              <td style="text-align:right;padding:10px 12px;color:#6C63FF;">${s.shin}</td>
              <td style="text-align:right;padding:10px 12px;color:#22c997;">${s.re}</td>
              <td style="text-align:right;padding:10px 12px;color:#FF6B6B;">${s.insu}</td>
              <td style="text-align:right;padding:10px 12px;color:#999;">${avg}</td>
              <td style="text-align:right;padding:10px 12px;color:#aaa;">${pct}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  renderBar('worker_bar', workerCountMap, 10);
  renderDonut('donut_worker','legend_worker',workerCountMap);
}

// ===================== 공통 렌더 함수 =====================
function renderDonut(canvasId, legendId, dataMap) {
  const entries = Object.entries(dataMap).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,[,v])=>s+v,0);
  const canvas = document.getElementById(canvasId);
  const legendEl = document.getElementById(legendId);
  if (!entries.length||!canvas) { if(canvas) canvas.parentElement.innerHTML='<div class="empty">데이터 없음</div>'; return; }
  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{ labels:entries.map(([k])=>k), datasets:[{data:entries.map(([,v])=>v), backgroundColor:COLORS, borderWidth:2, borderColor:'#fff', hoverOffset:6}] },
    options:{ cutout:'68%', plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${ctx.raw}건 (${Math.round(ctx.raw/total*100)}%)`}} }, animation:{animateRotate:true,duration:700} }
  });
  legendEl.innerHTML = entries.slice(0,7).map(([k,v],i)=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${COLORS[i%COLORS.length]}"></div>
      <span class="legend-name">${k}</span>
      <span class="legend-val">${v}건 · ${Math.round(v/total*100)}%</span>
    </div>`).join('');
}

function renderBar(elId, dataMap, limit=7) {
  const el = document.getElementById(elId);
  if (!el) return;
  const entries = Object.entries(dataMap).sort((a,b)=>b[1]-a[1]).slice(0,limit);
  const total = entries.reduce((s,[,v])=>s+v,0);
  if (!entries.length) { el.innerHTML='<div class="empty">데이터 없음</div>'; return; }
  el.innerHTML = entries.map(([k,v],i)=>`
    <div class="bar-item">
      <div class="bar-meta"><span class="bar-name">${k}</span><span class="bar-count">${v.toLocaleString()}건 · ${Math.round(v/total*100)}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/total*100)}%;background:${COLORS[i%COLORS.length]};"></div></div>
    </div>`).join('');
}

function bindTooltips() {
  document.querySelectorAll('.tooltip-wrap').forEach(el => {
    const tip = el.getAttribute('data-tip');
    if (!tip) return;
    let box = null;
    el.addEventListener('mouseenter', e => {
      box = document.createElement('div');
      box.className = 'custom-tooltip';
      box.innerText = tip;
      document.body.appendChild(box);
      moveTip(box, e);
    });
    el.addEventListener('mousemove', e => { if(box) moveTip(box, e); });
    el.addEventListener('mouseleave', () => { if(box){box.remove();box=null;} });
  });
}
function moveTip(box, e) {
  const bw = box.offsetWidth||160, bh = box.offsetHeight||60;
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = e.clientX+16, y = e.clientY-10;
  if (x+bw > vw-10) x = e.clientX-bw-10;
  if (y+bh > vh-10) y = vh-bh-10;
  box.style.left = x+'px';
  box.style.top  = y+'px';
}
</script>
